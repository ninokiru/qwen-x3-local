[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-coder-x3"
version = "0.2.0"
description = "Experimental Qwen2.5-Coder-derived hybrid coding transformer"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "transformers>=4.45",
  "safetensors>=0.4",
  "huggingface_hub>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
